name: price-radar

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: mkagg-postgres
    environment:
      POSTGRES_DB: mkagg
      POSTGRES_USER: mkagg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mkagg_dev_only}
      # Cyrillic product data: make the collation explicit rather than
      # inheriting whatever the host locale happens to be.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # 5433 to avoid clashing with a local PG
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkagg -d mkagg"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Applies db/migrations in version order, then exits.
  #   docker compose run --rm flyway migrate
  #   docker compose run --rm flyway info
  #   docker compose run --rm flyway validate
  #
  # Connection details MUST live in `environment`, not in `command`:
  # `docker compose run <service> <args>` REPLACES the compose `command`, so
  # any -url/-user/-password put there is silently dropped and Flyway fails
  # with "Unable to connect to the database. Configure the url, user and
  # password!". Env vars survive the override, so every subcommand works.
  flyway:
    image: flyway/flyway:10.17-alpine
    container_name: mkagg-flyway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/mkagg
      FLYWAY_USER: mkagg
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-mkagg_dev_only}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "20"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      # Migrations are hand-reviewed; fail loudly rather than reorder.
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./db/migrations:/flyway/sql:ro

  # Serving layer. Reads the catalogue and records outbound clicks; it never
  # writes to the catalogue and never migrates the schema.
  #   docker compose up -d --build api
  #   docker compose run --rm api-test      # unit tests, no JDK needed
  api:
    build:
      context: ./api
    container_name: price-radar-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_JDBC: jdbc:postgresql://postgres:5432/mkagg
      POSTGRES_USER: mkagg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mkagg_dev_only}
      PRICE_RADAR_COUNTRY: MK
      # Must be a real secret outside local development: an unsalted hash of
      # an IPv4 address is reversible by brute force.
      CLICK_IP_HASH_SALT: ${CLICK_IP_HASH_SALT:-dev-only-change-me}
      # The Next.js rewrite proxies /out/{id}, so without this every
      # click would hash to the proxy's own address and the bot and
      # deduplication statistics would be meaningless. Safe here
      # because Next is the only thing in front of the API.
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  # One-shot test runner, so `mvn test` works without a local toolchain.
  api-test:
    image: maven:3.9-eclipse-temurin-21
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ./api:/app
      - maven-cache:/root/.m2
    command: ["mvn", "-B", "test"]

  redis:
    image: redis:7.4-alpine
    container_name: mkagg-redis
    # Token buckets for per-domain rate limiting, plus the probe queue.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  maven-cache:
