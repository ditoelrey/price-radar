[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkagg"
version = "0.1.0"
description = "Ingestion, normalisation and product matching for the MK sneaker price aggregator"
requires-python = ">=3.11"

# The scaffold deliberately runs on the standard library alone, so the test
# suite works on a clean checkout with no install step. Everything below is
# for the live pipeline, not for the parsers.
dependencies = []

[project.optional-dependencies]
pipeline = [
    "httpx[http2]>=0.27",        # fetcher; HTTP/2 keeps the probe loop cheap
    "selectolax>=0.3.21",        # fast HTML parsing, drop-in for the regex paths
    "psycopg[binary,pool]>=3.2", # Postgres
    "rapidfuzz>=3.9",            # ~50x faster token_set_ratio, same metric
    "pydantic>=2.8",
    "structlog>=24.1",
    "tenacity>=8.5",             # retry/backoff per merchant
    "redis>=5.0",                # token buckets + the probe queue
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["mkagg"]
mypy_path = "src"
warn_unused_ignores = true
