spring:
  application:
    name: price-radar-api

  datasource:
    url: ${DATABASE_URL_JDBC:jdbc:postgresql://localhost:5433/mkagg}
    username: ${POSTGRES_USER:mkagg}
    password: ${POSTGRES_PASSWORD:mkagg_dev_only}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 2
      # The redirect path must never queue behind a slow listing query.
      connection-timeout: 2000
      pool-name: price-radar-pool

  # Java 21 virtual threads. The serving layer is almost entirely waiting on
  # Postgres, so this removes the thread-pool ceiling without any reactive
  # rewrite: blocking code, non-blocking behaviour.
  threads:
    virtual:
      enabled: true

  # Schema ownership lives with the ingestion side: db/migrations, applied by
  # the Flyway container. If this app also migrated, two writers would race
  # the schema history table and the API could silently "upgrade" a database
  # the pipeline is mid-run against.
  flyway:
    enabled: false

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${API_PORT:8080}
  shutdown: graceful
  error:
    include-message: always
  # A partner shop's slow page must not be able to tie up our own server.
  tomcat:
    connection-timeout: 5s

price-radar:
  # Default storefront. Every query is scoped by country, so adding RS/HR/BA
  # is configuration rather than a migration.
  country: ${PRICE_RADAR_COUNTRY:MK}

  outbound:
    # Salt for click_event.ip_hash. MUST be set outside local development:
    # an unsalted hash of an IPv4 address is trivially reversible, which
    # would make the click log personal data we cannot defend.
    ip-hash-salt: ${CLICK_IP_HASH_SALT:dev-only-change-me}
    # Honour X-Forwarded-For only when a proxy we control sets it.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}

  media:
    # Where the ingestion side writes content-addressed product photos.
    root: ${PRICE_RADAR_MEDIA_ROOT:./media}

  freshness:
    # Above this, the UI must soften "in stock" to "listed". Matches the
    # honest-UI rule: never assert availability we cannot currently support.
    stale-after-minutes: ${STALE_AFTER_MINUTES:180}

logging:
  level:
    mk.priceradar: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
