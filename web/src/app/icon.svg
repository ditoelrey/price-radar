<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The same mark as components/logo.tsx. A favicon is a file the browser
       fetches rather than a component it renders, so the paths are written
       out twice on purpose; change one and change the other.

       Every glyph is a path. This file is rendered outside the page and
       outside its fonts, so `-50%` set as <text> could come back in
       something else entirely. -->
  <g transform="rotate(-12 12 12)">
    <path fill="#e11d48"
          d="M8.8 4.2h11A3.4 3.4 0 0 1 23.2 7.6v8.8a3.4 3.4 0 0 1-3.4 3.4h-11a2.7 2.7 0 0 1-1.95-.83l-4.3-4.45a3.6 3.6 0 0 1 0-5l4.3-4.45A2.7 2.7 0 0 1 8.8 4.2Z"/>
    <rect x="5.7" y="11.2" width="3" height="1.7" rx=".85" fill="#fff"/>
    <path d="M11.6 9.5H9.3v2.1h1.1a1.45 1.45 0 1 1-1.15 2.3"
          fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="14.2" cy="11.9" rx="1.5" ry="2.3" fill="none" stroke="#fff" stroke-width="1.3"/>
    <circle cx="17.2" cy="10.4" r=".85" fill="none" stroke="#fff" stroke-width=".85"/>
    <circle cx="19.1" cy="13.4" r=".85" fill="none" stroke="#fff" stroke-width=".85"/>
    <path d="M16.8 13.8 19.5 10" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
